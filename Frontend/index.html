<!DOCTYPE html>
<html>
<head>
<title>Password Encryptor</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="box">
<h2>Encrypt</h2>

<div class="example">
Example:<br>
abcd12 → cdef34
</div>

<div class="input-area">
<input id="encryptInput" placeholder="Enter plain text"
onkeydown="if(event.key==='Enter') encrypt()">

<img class="copy-icon"
src="https://cdn-icons-png.flaticon.com/512/1621/1621635.png"
onclick="copyText('encryptInput')">
</div>

<button class="action-btn" onclick="encrypt()">Encrypt</button>

<div class="output-area">
<div class="result" id="encryptResult"></div>

<img class="copy-icon"
src="https://cdn-icons-png.flaticon.com/512/1621/1621635.png"
onclick="copyResult('encryptResult')">
</div>

</div>


<div class="box">
<h2>Decrypt</h2>

<div class="example">
Example:<br>
cdef34 → abcd12
</div>

<div class="input-area">
<input id="decryptInput" placeholder="Enter encrypted text"
onkeydown="if(event.key==='Enter') decrypt()">

<img class="copy-icon"
src="https://cdn-icons-png.flaticon.com/512/1621/1621635.png"
onclick="copyText('decryptInput')">
</div>

<button class="action-btn" onclick="decrypt()">Decrypt</button>

<div class="output-area">
<div class="result" id="decryptResult"></div>

<img class="copy-icon"
src="https://cdn-icons-png.flaticon.com/512/1621/1621635.png"
onclick="copyResult('decryptResult')">
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
