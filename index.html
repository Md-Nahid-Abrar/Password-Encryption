<!DOCTYPE html>
<html>
<head>

<title>Password Encryptor</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:50px;
}


.container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}


.box{
    background:#222;
    width:350px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px #000;
}


h2{
    color:#00e676;
}


.example{
    background:#333;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    color:#ddd;
}


.input-area,
.output-area{
    display:flex;
    align-items:center;
    gap:5px;
    margin:10px 0;
}


input{

    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:16px;

}


.copy-btn{

    width:70px;
    padding:12px;
    background:#555;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;

}


.action-btn{

    width:95%;
    padding:12px;
    background:#00c853;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;

}


.action-btn:hover{

    background:#009624;

}



.result{

    flex:1;
    background:white;
    color:black;
    padding:12px;
    border-radius:8px;
    text-align:left;
    overflow-wrap:break-word;

}



.animate{

    animation:pop .5s ease;

}


@keyframes pop{

    0%{
        transform:scale(.8);
        opacity:.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}


</style>

</head>


<body>


<h1>Password Encryption Tool</h1>



<div class="container">



<!-- Encrypt -->


<div class="box">

<h2>Encrypt</h2>


<div class="example">
Example:<br>
abcd12 → cdef34
</div>


<div class="input-area">

<input id="encryptInput" placeholder="Enter plain text">

<button class="copy-btn"
onclick="copyText('encryptInput')">
Copy
</button>

</div>



<button class="action-btn"
onclick="encrypt()">
Encrypt
</button>



<div class="output-area">

<div class="result" id="encryptResult">
 
</div>


<button class="copy-btn"
onclick="copyResult('encryptResult')">
Copy
</button>


</div>


</div>





<!-- Decrypt -->


<div class="box">

<h2>Decrypt</h2>


<div class="example">
Example:<br>
cdef34 → abcd12
</div>



<div class="input-area">

<input id="decryptInput" placeholder="Enter encrypted text">

<button class="copy-btn"
onclick="copyText('decryptInput')">
Copy
</button>


</div>



<button class="action-btn"
onclick="decrypt()">
Decrypt
</button>



<div class="output-area">


<div class="result" id="decryptResult">
 
</div>


<button class="copy-btn"
onclick="copyResult('decryptResult')">
Copy
</button>


</div>


</div>



</div>






<script>


let encryption_key = 2;



function encrypt(){


let text=document.getElementById("encryptInput").value;

let encrypted="";


for(let i of text){


if(i==='z')
encrypted+='a';


else if(i===' ')
encrypted+='$';


else
encrypted+=String.fromCharCode(i.charCodeAt(0)+encryption_key);


}



let box=document.getElementById("encryptResult");

box.innerHTML=encrypted;

animate(box);


}




function decrypt(){


let text=document.getElementById("decryptInput").value;

let decrypted="";


for(let i of text){


if(i==='a')
decrypted+='z';


else if(i==='$')
decrypted+=' ';


else
decrypted+=String.fromCharCode(i.charCodeAt(0)-encryption_key);


}



let box=document.getElementById("decryptResult");

box.innerHTML=decrypted;

animate(box);


}





function animate(element){

element.classList.remove("animate");

void element.offsetWidth;

element.classList.add("animate");

}




function copyText(id){

let text=document.getElementById(id);

navigator.clipboard.writeText(text.value);

}



function copyResult(id){

let text=document.getElementById(id).innerText;

navigator.clipboard.writeText(text);

}


</script>



</body>
</html>
